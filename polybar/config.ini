; =========================
; Polybar main configuration
; =========================

[colors]
background = #cc1e1e2e
foreground = #cdd6f4
muted      = #7f849c

; =========================
; Bar definition
; =========================

[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0

fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrainsMono:size=10;2

modules-left   = i3
modules-center = date
modules-right  = cpu memory

; --- System tray ---
tray-position = right
tray-padding = 6
tray-maxsize = 20
tray-background = ${colors.background}

enable-ipc = true
override-redirect = true
layer = top
wm-restack = i3

cursor-click = pointer
cursor-scroll = ns-resize

; =========================
; Modules
; =========================

[module/i3]
type = internal/i3

pin-workspaces = true
strip-wsnumbers = true
show-urgent = true

label-focused = %name%
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-urgent = %name%
label-urgent-padding = 2

; -------------------------

[module/date]
type = internal/date
interval = 1

time = %H:%M
label = %time%

; -------------------------

[module/cpu]
type = internal/cpu
interval = 2

label = CPU %percentage%%

; -------------------------

[module/memory]
type = internal/memory
interval = 2

label = RAM %percentage_used%%

; =========================
; Settings
; =========================

[settings]
screenchange-reload = true
pseudo-transparency = false

